{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="mb-4">📋 Student Dashboard</h4>

                <!-- Add Student Form -->
                <form method="POST" action="/add-student" class="row g-2 mb-4">
                    <div class="col-md-3">
                        <input class="form-control" name="name" placeholder="👤 Name" required>
                    </div>
                    <div class="col-md-3">
                        <input class="form-control" name="email" placeholder="📧 Email" required>
                    </div>
                    <div class="col-md-3">
                        <input class="form-control" name="course" placeholder="📘 Course" required>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success w-100">➕ Add Student</button>
                    </div>
                </form>

                <!-- Students Table -->
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>👤 Name</th>
                            <th>📧 Email</th>
                            <th>📘 Course</th>
                            <th>⚙ Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student.name }}</td>
                            <td>{{ student.email }}</td>
                            <td>{{ student.course }}</td>
                            <td>
                                <a href="/edit-student/{{ student.id }}" class="btn btn-warning btn-sm">✏ Edit</a>
                                <a href="/delete-student/{{ student.id }}" class="btn btn-danger btn-sm">🗑 Delete</a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted">No students found 📝</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
